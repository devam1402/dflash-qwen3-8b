name: repository-check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema

      - name: Validate YAML
        run: |
          python - <<'PY'
          import glob
          import yaml

          for path in glob.glob("configs/*.yaml"):
              with open(path) as f:
                  yaml.safe_load(f)
              print(f"OK: {path}")
          PY

      - name: Validate JSON schema
        run: |
          python - <<'PY'
          import json

          with open("results/schema.json") as f:
              json.load(f)

          print("OK: results/schema.json")
          PY

      - name: Validate shell scripts
        run: |
          if compgen -G "scripts/*.sh" > /dev/null; then
            bash -n scripts/*.sh
          else
            echo "No scripts yet - Stage 1"
          fi

      - name: Make check
        run: make check
