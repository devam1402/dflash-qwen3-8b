serving_contract:
  num_speculative_tokens: 7

reproducibility:
  speculators_version: "<PIN_AFTER_ENV_CHECK>"
  vllm_version: "<PIN_AFTER_ENV_CHECK>"

checkpoint:
  hf_repo: "<YOUR_HF_ORG>/Qwen3-8B-speculator.dflash"
  hf_revision: "<SET_AFTER_PUBLISH>"
